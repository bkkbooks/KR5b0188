front:
  text: 金籙十回度人晚朝開收儀
  hash: sha256:3511eb7b5725a3365a5ee6badb5ec2cf06cac064fb7da5f5a96090038edfd7e9
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0188_HFL_000-001a, image: hfl/0267/0267-124.png}
body:
  text: 宣齊意後三歸依宿命讃宿命有信然弱喪謂之無皆欲眼前見過目即言悠大賢明道教慘戚憫頑夫依依念子苦勤勤令我憂宣第九回開經文臣恭以洞玄赤書空青紫字九霞煥彩皆芒金角玊之文八龍成章亦刻玊鑄金之字祕於上清之境寒靈之殿盛以立空之案霜羅之巾日月得之以運行終古不息帝王得之而保鎮萬世太平猗歟盛哉蔑以加矣臣今欽奉綸音崇修金籙延禧大齊幾晝夜臣今引領官衆升壇第九回轉誦太上洞玄靈寶無量度人上品妙經朝禮寶誥仰依無上三寶慈尊十方諸天大聖慈悲願力主盟經功伏願玄真啓迪上聖提㩦神光照燭於慧源道氣流通於靈府令臣等研精覃思豈略通大義之可為索隱鉤深必洞明至言而後已功沾水陸善及邦家稽首虛皇修行經法敷座吟諷經畢解座吟回向臣恭以九為陽極宜感召於天真兌乃金成故發泄於地藏天不愛道而圖書出世地不愛寶而金玊露形昔老君降蜀都亦感地涌玊局虛皇遊西國自然地薦黃金蓋神功不約而同其靈應何常之有臣適來引領官衆升壇轉誦太上洞玄靈寶無量度人上品妙經第九遍徑用回向上方無極太上靈寶天尊上方保命護身天尊天垣帝座星君紫微垣列位星君中天北斗七元星君三台華蓋中宮一切星衆上方無極無量品至真大神飛天神王長生大聖無量度人君本命太歲祿馬尊神紫堂神煞官屬齊壇應感一切真靈乞以經功願力安鎮紫微中天黃道之次保命延生迎祥集慶伏願奉刻玉鑄金之簡顯連珠合璧之祥齊七政在玊衡靡差躔次轉一氣開壽域俱入鈞陶福佑邦家恩沾海宇稽首歸依旋行讃詠太極頌大道雖無心可以有情求佇駕空洞中回盻翳滄流淨明三界外蕭蕭玊京遊自無玄挺運誰能悟冥趣落落天漢澄俯仰即虛柔七玄散幽夜返胎順沈浮冥期苟潜凝陽九無娛憂覩此去來㑹誰復為淹留外身而身存真仙㑹良儔高切於上方恭文宣表關焚化宣十回開經文臣恭以上品度人蓋諸天之所共寶明真有格必四萬劫以方傳於是真經降世寰宇嚮風逮徐葛相傳則靈寶之科大備林王繼出則神霄之教復明然後服氣養生之方保國寧家之術層見疊出井井乎其有條兼容併包恢恢乎其不漏其道可謂大矣雖聖又何加焉臣今欽奉綸音崇修金籙延禧大齊幾晝夜臣今引領官衆升壇第十回轉誦太上洞玄靈寶無量度人上品妙經朝禮寶誥仰依無上三寶慈尊十方諸天大聖慈悲願力主盟經功伏願於皇大道有赫高真成周回十過之功盡終始一經之義八方六合悉皆涵泳於仁風寸地尺天莫不沾濡於法雨同壇清衆妙振靈音稽首虛皇修行經法敷座吟諷經畢解座吟回向高功存思如初臣恭以誦上品之真必十過而成數修聖胎之法須十月以成功鼎器法乎乾坤火𠊱取於復姤故得玄珠有象玊音成形存乎我則復命歸根純陽被體施於人則延生保命在世長年蓋經功丹道理則同歸在學士至人修之自見臣適來引領官衆升壇轉誦太上洞玄靈寶無量度人上品妙經第十回徑用回向下方無極太上靈寶天尊下方興大福力天尊中央土德祖氣中皇上真道君鎮星真君中斗大魁星君下方無極無量品至真大神飛天神王長生大聖無量度人君本命太歲祿馬尊神紫堂神煞官衆齊壇應感一切真靈乞以經功願力安鎮下方十二分野所屬之地伏願中斗總靈鎮星四據列居錯峙正分度於周天翕受敷施兆禎祥於寰宇凡在懷生之物同瞻有赫之光伏願妙化旁周嘉祥駢集十方悉陶於聖化萬國咸歸於至仁蠢動含靈俱沾恩澤稽首歸依旋行讃詠太極頌亹亹玄中趣湛湛清漢波代謝若循環椿木不改柯靜心念至真隨運順離羅感應理常通神識逮自徂淡遊初無際繁想洞九霞飛根散玄葉理返非有他常能誦玊章玄音徹霄霞甲申洪災至控翮王母家永享無終紀豈知年劫多高功於下方恭文宣表關焚化宣普嘆經文詳夫道本無言非言無以傳道經非待誦因誦而後知經昔混沌之未形於篇章而何有恭惟大羅元始玊晨道君凝梵氣於虛無鍊真文於浩劫乃於始青浮黎之國說此洞玄靈寶之經懸一黍於天中引衆真於珠內敷弘至妙開化含生混洞赤文首述化生諸天之妙元洞玊曆復明保制劫運之功敷落五篇周回十過復出大梵隱語靈書中篇光照十方字長一丈皆上帝內名之隱韻難可尋詳逮皇人受命於天尊為之訓解上以安天而鎮地下以阜物而康民祕在上宫不傳下世自漢武帝得之於西王毋斯道以傳及徐真人授之於葛仙翁其書亦廣惟此無量上品獨為諸卷統宗今之日臣等欽奉綸音崇修大教按金籙大齊之式舉度人轉經之儀當願諸天下觀衆真保舉五帝之玊童玊女營衛神文八威之金虎金龍護持寶笈五色鬱勃以陳瑞四氣朗清以效祥調順天經三辰五星之軌道鎮安國土九州四海之升平帝祚洪延民生富庶知音誦者無不辟無不度無不禳自天祐之得其名得其祿得其夀然後五服六親之眷屬俱保康寧九州四海之臣鄰咸臻亨泰根荄甲拆各安生化之天鱗甲羽毛咸適逍遙之樂願與三界有緣之衆同歸一乘最上之機法衆虔誠收經如法高功收經讃三聞經納官復爐下壇謝神王謝師回向金籙十回度人晚朝開收儀
